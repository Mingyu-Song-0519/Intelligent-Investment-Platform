[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "jarvis-stock"
version = "0.1.0"
description = "한국 주식 분석 시스템 (Korean Stock Analysis System)"
requires-python = ">=3.10"

# --- Base dependencies (always installed) ---
dependencies = [
    # Core data
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "yfinance>=0.2.30,<1.0.0",
    "finance-datareader>=0.9.50,<1.0.0",
    # Technical analysis
    "ta>=0.10.2,<1.0.0",
    # Visualization
    "matplotlib>=3.7.0,<4.0.0",
    "plotly>=5.17.0,<6.0.0",
    "mplfinance>=0.12.0,<1.0.0",
    # Web dashboard
    "streamlit>=1.28.0,<2.0.0",
    # Database
    "sqlalchemy>=2.0.0,<3.0.0",
    # Utilities
    "python-dotenv>=1.0.0,<2.0.0",
    "requests>=2.31.0,<3.0.0",
    "tqdm>=4.66.0,<5.0.0",
    # Korean market data
    "pykrx>=1.0.0,<2.0.0",
    # Social trend
    "pytrends>=4.9.0,<5.0.0",
    # Real-time (google-genai requires >=13.0)
    "websockets>=13.0,<17.0",
    # News & sentiment (light)
    "beautifulsoup4>=4.12.0,<5.0.0",
    "feedparser>=6.0.10,<7.0.0",
    "textblob>=0.17.0,<1.0.0",
    "vaderSentiment>=3.3.2,<4.0.0",
    # AI Chatbot
    "google-genai>=1.0.0,<2.0.0",
]

# --- Optional extras (install as needed) ---
[project.optional-dependencies]

# Torch-based: Transformer predictor + HuggingFace NLP
ml-torch = [
    "torch>=2.0.0,<3.0.0",
    "transformers>=4.30.0,<5.0.0",
]

# TensorFlow/Keras: LSTM predictor
ml-tf = [
    "tensorflow>=2.14.0,<3.0.0",
]

# Gradient-boosting ensemble
ml-boost = [
    "scikit-learn>=1.3.0,<2.0.0",
    "xgboost>=2.0.0,<3.0.0",
    "lightgbm>=4.0.0,<5.0.0",
    "catboost>=1.2.0,<2.0.0",
]

# Full ML stack (all models)
ml-all = [
    "jarvis-stock[ml-torch]",
    "jarvis-stock[ml-tf]",
    "jarvis-stock[ml-boost]",
]

# Development tools
dev = [
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<6.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "ruff>=0.1.0,<1.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pip-tools>=7.0.0,<8.0.0",
]

# Everything (full install)
all = [
    "jarvis-stock[ml-all]",
    "jarvis-stock[dev]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools]
py-modules = ["config"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
