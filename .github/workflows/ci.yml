name: CI - Python Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install project (dev extras)
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff lint
        run: ruff check src/ --output-format=github

      - name: Run ruff format check
        run: ruff format --check src/

      - name: Run mypy type check
        run: mypy src/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install project (dev extras, no ML)
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run characterization tests
        run: |
          pytest tests/characterization/ -v --tb=short \
            --cov=src/infrastructure/adapters \
            --cov=src/infrastructure/market_data \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing
        continue-on-error: true

      - name: Run all tests (excluding ML-dependent)
        run: |
          pytest tests/ \
            --ignore=tests/models/ \
            -v --tb=short \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=15
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit --requirement requirements.txt
        continue-on-error: true

  pr-comment:
    name: PR Coverage Comment
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🧪 Python Test Results

✅ Unit tests completed. Check the [Actions tab](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for detailed results.

📊 Coverage report available in the artifacts section.`
            });
