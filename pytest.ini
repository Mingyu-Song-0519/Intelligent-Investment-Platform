[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests

# Coverage (임계값은 CI에서 별도 관리 — 특성화 테스트 subset 실행 시 실패 방지)
addopts =
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    -v

# Timeouts
timeout = 300
